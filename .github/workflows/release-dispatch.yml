name: Dispatch selected release build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag, z. B. v1.0.0"
        required: true
        default: "v0.0.1"
        type: string

      build_mode:
        description: "PyInstaller-Modus"
        required: true
        type: choice
        default: "onedir"
        options:
          - onefile
          - onedir

      target_language:
        description: "Welche Sprache bauen?"
        required: true
        type: choice
        default: "Build All"
        options:
          - Build All
          - dbase
          - pascal
          - cc
          - lisp

      python_version:
        description: "Python-Version"
        required: true
        default: "3.14"
        type: string

      java_version:
        description: "Java-Version für ANTLR"
        required: true
        default: "17"
        type: string

      antlr_tool_version:
        description: "ANTLR Tool Version"
        required: true
        default: "4.13.2"
        type: string

      antlr_runtime_version:
        description: "ANTLR4 Python Runtime Version"
        required: true
        default: "4.13.2"
        type: string

permissions:
  contents: write

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build matrix from input
        id: set-matrix
        shell: python
        run: |
          import json
          import os

          target = "${{ inputs.target_language }}"

          if target == "Build All":
              langs = ["dbase", "pascal", "cc", "lisp"]
          else:
              langs = [target]

          matrix = {"language": langs}

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")

  build-selected:
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}

    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ inputs.tag }}
      build_mode: ${{ inputs.build_mode }}
      language: ${{ matrix.language }}
      python_version: ${{ inputs.python_version }}
      java_version: ${{ inputs.java_version }}
      antlr_tool_version: ${{ inputs.antlr_tool_version }}
      antlr_runtime_version: ${{ inputs.antlr_runtime_version }}
    secrets: inherit
