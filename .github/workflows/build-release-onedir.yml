name: Build Windows EXE (onedir) + Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag, v1.0.0'
        required: true
        default: 'v0.0.1'
      python_version:
        description: 'Python-Version'
        required: true
        default: '3.14'
      antlr_runtime_version:
        description: 'ANTLR4 Python Runtime Version'
        required: true
        default: '4.13.2'

permissions:
  contents: write

env:
  APP_DIR: src
  APP_ENTRY: src/dBaseRunner.py
  REQUIREMENTS_FILE: requirements.txt

jobs:
  build-onedir:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: 'pip'
          cache-dependency-path: ${{ env.REQUIREMENTS_FILE }}

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r $env:REQUIREMENTS_FILE
          python -m pip install pyinstaller antlr4-python3-runtime==${{ inputs.antlr_runtime_version }}

      - name: Show tool versions
        shell: pwsh
        run: |
          python --version
          pyinstaller --version
          python -c "import antlr4, PyQt5, PyQt5.QtWebEngineWidgets, reportlab, polib; print('Runtime ok')"

      - name: Validate project files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path $env:APP_ENTRY)) { throw "Entry file not found: $env:APP_ENTRY" }
          foreach ($p in @('src/resources_rc.py','src/data','src/tests','src/gen')) {
            if (-not (Test-Path $p)) { throw "Required path not found: $p" }
          }

      - name: Build onedir EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $args = @(
            '--noconfirm',
            '--clean',
            '--onedir',
            '--windowed',
            '--name', 'dBaseRunner',
            '--paths', 'src',
            '--hidden-import', 'antlr4',
            '--hidden-import', 'resources_rc',
            '--hidden-import', 'gen.dBaseLexer',
            '--hidden-import', 'gen.dBaseParser',
            '--hidden-import', 'gen.dBaseParserListener',
            '--hidden-import', 'gen.dBaseParserVisitor',
            '--collect-submodules', 'antlr4',
            '--collect-all', 'PyQt5',
            '--collect-all', 'PyQtWebEngine',
            '--collect-all', 'PyQt5.QtWebEngineCore',
            '--collect-all', 'PyQt5.QtWebEngineWidgets',
            '--collect-all', 'PyQt5.QtSvg',
            '--copy-metadata', 'antlr4-python3-runtime',
            '--copy-metadata', 'reportlab',
            '--copy-metadata', 'polib',
            '--add-data', 'src/data;data',
            '--add-data', 'src/tests;tests',
            '--add-data', 'src/gen;gen',
            'src/dBaseRunner.py'
          )
          pyinstaller @args

      - name: Prepare release ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path release) { Remove-Item release -Recurse -Force }
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist\dBaseRunner release\dBaseRunner -Recurse -Force
          Compress-Archive -Path release\dBaseRunner\* -DestinationPath dBaseRunner-${{ inputs.tag }}-windows-onedir.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dBaseRunner-${{ inputs.tag }}-windows-onedir
          path: dBaseRunner-${{ inputs.tag }}-windows-onedir.zip
          if-no-files-found: error

      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: dBaseRunner ${{ inputs.tag }}
          generate_release_notes: true
          files: dBaseRunner-${{ inputs.tag }}-windows-onedir.zip
          overwrite_files: true
